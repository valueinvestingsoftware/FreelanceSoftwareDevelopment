<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Project Consultation</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b1220;
        color: #e5e7eb;
    }

    header {
        padding: 60px 20px;
        text-align: center;
        background: #111827;
    }

    header h1 {
        font-size: 38px;
    }

    .container {
        max-width: 900px;
        margin: auto;
        padding: 40px 20px;
    }

    .card {
        background: #111827;
        padding: 25px;
        border-radius: 12px;
        border: 1px solid #1f2937;
    }

    input, select, textarea {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        margin-bottom: 15px;
        border-radius: 8px;
        border: 1px solid #1f2937;
        background: #0f172a;
        color: white;
    }

    button {
        width: 100%;
        padding: 14px;
        background: #22c55e;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background: #16a34a;
    }

    .success {
        display: none;
        margin-top: 20px;
        padding: 15px;
        background: #0f172a;
        border-left: 4px solid #22c55e;
        border-radius: 8px;
        color: #22c55e;
    }
</style>
</head>

<body>

<header>
    <h1>Project Consultation</h1>
    <p>Tell us about your software idea and we will respond with a development plan.</p>
</header>

<div class="container">

    <div class="card">

        <!-- FORM -->
        <form id="contactForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">

            <label>Name</label>
            <input type="text" name="name" required>

            <label>Email</label>
            <input type="email" name="email" required>

            <label>Project Type</label>
            <select name="project_type">
                <option>Web Application</option>
                <option>Mobile App</option>
                <option>Business System</option>
                <option>API / Integration</option>
                <option>Automation Tool</option>
            </select>

            <label>Message</label>
            <textarea name="message" required></textarea>

            <button type="submit">Send Request</button>
        </form>

        <!-- SUCCESS MESSAGE -->
        <div class="success" id="successMessage">
            ✔ Your message has been sent successfully. We will contact you soon.
        </div>

    </div>

</div>

<script>
    const form = document.getElementById("contactForm");
    const success = document.getElementById("successMessage");

    form.addEventListener("submit", async function(e) {
        e.preventDefault();

        const data = new FormData(form);

        const response = await fetch(form.action, {
            method: "POST",
            body: data,
            headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
            form.reset();
            success.style.display = "block";
        } else {
            alert("Something went wrong. Please try again.");
        }
    });
</script>

</body>
</html>
